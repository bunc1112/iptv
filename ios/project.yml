name: FreshBrowser
options:
  bundleIdPrefix: com.test
  deploymentTarget:
    iOS: "15.0"
targets:
  FreshBrowser:
    type: application
    platform: iOS
    sources: [FreshBrowser]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.test.freshbrowser
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: FreshBrowser
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: FreshBrowser/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}

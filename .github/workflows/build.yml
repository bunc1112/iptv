name: Build Bunc APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'iptv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore (if configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bunc.keystore"
            echo "have_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          BUNC_VERSION_NAME: "1.0.${{ github.run_number }}"
          BUNC_VERSION_CODE: "${{ github.run_number }}"
          BUNC_KEYSTORE: ${{ steps.keystore.outputs.have_keystore == 'true' && format('{0}/bunc.keystore', runner.temp) || '' }}
          BUNC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUNC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BUNC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.have_keystore }}" = "true" ]; then
            echo "Building SIGNED release APK"
            ./gradlew --no-daemon assembleRelease
            SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          else
            echo "No keystore secret set — building debug APK (installable, but reinstall needed to update)"
            ./gradlew --no-daemon assembleDebug
            SRC=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          fi
          cp "$SRC" "Bunc-1.0.${{ github.run_number }}.apk"
          echo "APK_FILE=Bunc-1.0.${{ github.run_number }}.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bunc-APK
          path: ${{ env.APK_FILE }}

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Bunc 1.0.${{ github.run_number }}"
          body: |
            Automatic build of Bunc from commit ${{ github.sha }}.
            Download the APK below and sideload it (enable "unknown sources").
          files: ${{ env.APK_FILE }}
          make_latest: true

name: Build iOS IPA

on:
  push:
    branches: [ freshbrowser ]
    paths: [ "ios/**", ".github/workflows/build-ios.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project FreshBrowser.xcodeproj -scheme FreshBrowser \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FreshBrowser.app Payload/
          zip -qr FreshBrowser-unsigned.ipa Payload

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: freshbrowser-ios-latest
          name: FreshBrowser iOS latest build
          prerelease: true
          files: ios/FreshBrowser-unsigned.ipa
